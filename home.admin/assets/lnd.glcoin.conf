# lnd configuration for Glcoin (reference file - actual conf generated by lnd.install.sh)
# The patched LND binary uses Bitcoin's internal wire protocol with Glcoin chain params.
# Therefore lnd.conf uses [Bitcoin]/[Bitcoind] sections, NOT [Glcoin]/[Glcoind].

[Application Options]
debuglevel=info
maxpendingchannels=5
alias=raspiblesk
color=#68F442
nat=false
lnddir=/mnt/hdd/app-data/lnd

ignore-historical-gossip-filters=1
stagger-initial-reconnect=true
gc-canceled-invoices-on-startup=true
gc-canceled-invoices-on-the-fly=true

tlsautorefresh=1
tlsdisableautofill=1
tlscertpath=/mnt/hdd/app-data/lnd/tls.cert
tlskeypath=/mnt/hdd/app-data/lnd/tls.key

rpclisten=127.0.0.1:10009
restlisten=127.0.0.1:8080
listen=0.0.0.0:9735

maxlogfiles=2
maxlogfilesize=400

[Bitcoin]
bitcoin.active=1
bitcoin.mainnet=1
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=127.0.0.1:1617
bitcoind.rpcuser=glcoinrpc
bitcoind.rpcpass=CHANGE_THIS
bitcoind.zmqpubrawblock=tcp://127.0.0.1:21617
bitcoind.zmqpubrawtx=tcp://127.0.0.1:21618

[bolt]
db.bolt.auto-compact=true
db.bolt.auto-compact-min-age=672h

[healthcheck]
healthcheck.chainbackend.attempts=3
healthcheck.chainbackend.timeout=2m0s
healthcheck.chainbackend.interval=1m30s

[workers]
workers.sig=4
workers.write=4

[rpcmiddleware]
rpcmiddleware.enable=true
