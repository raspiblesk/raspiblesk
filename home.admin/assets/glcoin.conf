# glcoind configuration
# some values might be overruled directly systemd-service exec call parameters

# mainnet/testnet
testnet=0

# Glcoind options
server=1
daemon=1
txindex=0
disablewallet=1
peerbloomfilters=1
datadir=/mnt/hdd/app-storage/glcoin
main.debuglogfile=/mnt/hdd/app-data/glcoin/debug.log
test.debuglogfile=/mnt/hdd/app-data/glcoin/testnet3/debug.log
signet.debuglogfile=/mnt/hdd/app-data/glcoin/signet/debug.log

# Connection settings
rpcuser=raspibolt
rpcpassword=passwordB
main.rpcport=1617
test.rpcport=11617
signet.rpcport=31617
rpcallowip=127.0.0.1
main.rpcbind=127.0.0.1:1617
test.rpcbind=127.0.0.1:11617
signet.rpcbind=127.0.0.1:31617
main.zmqpubrawblock=tcp://127.0.0.1:21617
main.zmqpubrawtx=tcp://127.0.0.1:21618
test.zmqpubrawblock=tcp://127.0.0.1:31617
test.zmqpubrawtx=tcp://127.0.0.1:31618
signet.zmqpubrawblock=tcp://127.0.0.1:41617
signet.zmqpubrawtx=tcp://127.0.0.1:41618

# Raspberry Pi optimizations
dbcache=128
maxorphantx=10
maxmempool=300
maxconnections=40
maxuploadtarget=5000

# clearnet by default — switch to Tor via: tor.network.sh on
onlynet=ipv4
onlynet=ipv6

# DNS seed lookup. glcoin v0.1.11+ has seed.glcoin.org and dnsseed.glcoin.org
# compiled into chainparams.cpp vSeeds for mainnet, served by glcoin-seeder.
# With dnsseed=0 the Pi cannot learn any peer for mainnet.
dnsseed=1

# bootstrap peers — peer discovery is via the DNS seeder above; no manual
# main.addnode= is needed. Signet keeps its fixed seed entry as a fallback.
signet.addnode=seed.glcoin.org:31618
