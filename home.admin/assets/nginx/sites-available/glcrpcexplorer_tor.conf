## glcrpcexplorer_tor.conf

server {
    listen 3022;
    server_name _;

    include /etc/nginx/snippets/gzip-params.conf;

    access_log /var/log/nginx/access_glcrpcexplorer.log;
    error_log /var/log/nginx/error_glcrpcexplorer.log;

    location / {
        proxy_pass http://127.0.0.1:3020;

        include /etc/nginx/snippets/ssl-proxy-params.conf;
    }

}
