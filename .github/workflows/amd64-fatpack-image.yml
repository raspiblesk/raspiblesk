jobs:
  amd64-image-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set values
        id: set_values
        run: |
          echo "BUILD_DATE=$(date +"%Y-%m-%d")" >> $GITHUB_ENV
          echo "BUILD_VERSION=$(git describe --always --tags)" >> $GITHUB_ENV
          if [ -z "$GITHUB_HEAD_REF" ]; then
            echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
          fi
          if [[ "${{github.event_name}}" == "pull_request" ]]; then
            echo "GITHUB_USER=${{github.event.pull_request.head.repo.owner.login}}" >> $GITHUB_OUTPUT
          else
            echo "GITHUB_USER=$(echo ${{github.repository}} | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          fi

      - name: Display the build name
        run: echo "Building the raspiblesk-amd64-debian-image-${{env.BUILD_DATE}}-${{env.BUILD_VERSION}}"

      - name: Run the build script
        run: |
          echo "Using the variables: --pack fatpack --github_user ${{steps.set_values.outputs.GITHUB_USER}} --branch ${{env.BRANCH_NAME}} --preseed_file preseed.cfg --boot uefi --desktop none"
          cd ci/amd64
          bash packer.build.amd64-debian.sh --pack fatpack --github_user ${{steps.set_values.outputs.GITHUB_USER}} --branch ${{env.BRANCH_NAME}} --preseed_file preseed.cfg --boot uefi --desktop none

      - name: Compute checksum of the raw image
        run: |
          cd ci/amd64/builds/raspiblesk-amd64-debian-fatpack-qemu/
          sha256sum raspiblesk-amd64-debian-fatpack.qcow2 > raspiblesk-amd64-debian-fatpack.qcow2.sha256

      - name: Compress image
        run: |
          cd ci/amd64/builds/raspiblesk-amd64-debian-fatpack-qemu/
          gzip -v9 raspiblesk-amd64-debian-fatpack.qcow2

      - name: Compute checksum of the compressed image
        run: |
          cd ci/amd64/builds/raspiblesk-amd64-debian-fatpack-qemu/
          sha256sum raspiblesk-amd64-debian-fatpack.qcow2.gz > raspiblesk-amd64-debian-fatpack.qcow2.gz.sha256

      - name: Upload the image and checksums
        uses: actions/upload-artifact@v4
        with:
          name: raspiblesk-amd64-image-${{env.BUILD_DATE}}-${{env.BUILD_VERSION}}
          path: |
            ${{github.workspace}}/ci/amd64/builds/raspiblesk-amd64-debian-fatpack-qemu/raspiblesk-amd64-debian-fatpack.qcow2.sha256
            ${{github.workspace}}/ci/amd64/builds/raspiblesk-amd64-debian-fatpack-qemu/raspiblesk-amd64-debian-fatpack.qcow2.gz
            ${{github.workspace}}/ci/amd64/builds/raspiblesk-amd64-debian-fatpack-qemu/raspiblesk-amd64-debian-fatpack.qcow2.gz.sha256
